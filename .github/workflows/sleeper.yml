name: sleeper-alerts

on:
  schedule:
    - cron: "*/30 * * * *"     # UTC; main.py decides (in America/Chicago, DST-aware) whether to send
  workflow_dispatch:
    inputs:
      mode:
        description: "pregame | postgame | auto"
        default: "auto"
      locked:
        description: "players you've locked, comma-separated (e.g. giannis, jerome)"
        required: false
        default: ""
      test:
        description: "test send: subject [TEST], doesn't use up today's pregame email"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sleeper-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - id: day
        run: echo "d=$(TZ=America/Chicago date +%F)" >> "$GITHUB_OUTPUT"
      # Raw API cache: players file refreshed at most once a day.
      - name: Restore Sleeper data cache
        uses: actions/cache@v4
        with:
          path: data_raw
          key: sleeper-raw-${{ steps.day.outputs.d }}-${{ github.run_id }}
          restore-keys: sleeper-raw-${{ steps.day.outputs.d }}-
      # Sent-alert and reported-lock state: kept in the Actions cache (not in git, not public).
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: sleeper-state-${{ github.run_id }}
          restore-keys: sleeper-state-
      - name: Run engine
        env:
          CI: "true"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SLEEPER_TOKEN: ${{ secrets.SLEEPER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOCKED_INPUT: ${{ github.event.inputs.locked }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          TEST_FLAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test != 'false' && '--test' || '' }}
        run: mkdir -p state && python main.py --quiet --mode "$MODE" $TEST_FLAG
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: sleeper-state-${{ github.run_id }}
