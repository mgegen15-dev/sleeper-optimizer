# All tunables for the Sleeper NBA decision engine. Edit here, not in code.

league_id: "1340092651755560960"
roster_id: 10
timezone: America/Chicago
cache_dir: data_raw          # raw API cache (gitignored)
state_file: state/sent.json  # sent-email state (committed by the workflow)

http:
  timeout_s: 30
  retries: 3

model:
  half_life_games: 7          # recency weight halves every 7 games
  recent_games: 15            # recency mean uses the last 15 games
  blend_weights:              # mean = weighted blend (renormalised over what's available)
    recency: 0.45
    season: 0.25
    projection: 0.30
  small_sample_gp: 8          # below this many games, shrink toward positional prior
  opp_adjust_cap: 0.05        # opponent adjustment capped at +/-5%
  opp_adjust_shrink_games: 25 # pseudo-games of "average opponent" added before computing the factor
  residual_samples: 400       # size of each player's outcome sample
  fallback_cv: 0.35           # shape used when a player has no history at all (gamma, this CV)
  # P(play) for THIS WEEK's games by Sleeper injury_status (missing status -> healthy)
  injury_play_prob:
    healthy: 0.97
    Questionable: 0.6
    GTD: 0.6
    DTD: 0.6
    Doubtful: 0.2
    Out: 0.0
    Sus: 0.0
    IR: 0.0
    NA: 0.0
  # Average availability over the REST OF SEASON (used for trades / season sim)
  ros_play_prob:
    healthy: 0.95
    Questionable: 0.88
    GTD: 0.88
    DTD: 0.88
    Doubtful: 0.75
    Out: 0.5
    Sus: 0.6
    IR: 0.3
    NA: 0.3

sims:
  seed: 20261127
  n_week: 50000         # Monte Carlo sims of the rest of this week (paired: SE ~0.15pp)
  n_screen: 2000        # cheaper sims when screening many candidates
  n_season: 10000       # season sims for finalists
  n_season_screen: 3000

schedule:
  pregame_lead_min: 90         # pregame goes out 90 min before the day's FIRST tip (whole slate, CT)
  cron_interval_min: 15        # matches the workflow cron; later than this counts as "catch-up"
  fallback_first_tip: "12:00"  # if tip times are unknown (ESPN down) but games exist, assume this
  lock_window_min: 45          # remind about an open lock call whose next game tips within 45 min
  lock_batch_min: 120          # one reminder covers every open call tipping within 2 h

season:
  playoff_teams: 6
  division_winners_qualify: true   # assumption: each division winner is guaranteed a spot
  week_sd_fallback: 30.0           # team weekly score SD if it can't be estimated
  last_regular_week: 18

waivers:
  candidates: 25          # top free agents (by blended FP/G) screened
  finalists: 6            # get full sims
  min_gp: 3
  drop_threshold_playoff_pp: 1.0   # recommend add/drop only if playoff odds rise >= 1pp ...
  drop_threshold_pwin_pp: 3.0      # ... or this week's P(win) rises >= 3pp
  # FAAB bid = clamp(k * dPlayoff_pp * remaining_budget / weeks_left, min_bid, max_frac * remaining)
  faab_k: 1.0
  faab_min_bid: 1
  faab_max_frac: 0.5
  protect_starters_today: true     # never drop someone starting tonight

trades:
  threshold_pp: 2.0       # flag trades that raise my playoff odds >= 2pp
  max_their_loss_pp: 3.0  # skip trades that hurt the other side more than this (unrealistic)
  screen_their_loss_pts: 6.0  # screening: max proxy points/week the other side may lose
  shortlist: 20
  finalists: 8
  depth_weight: 0.25      # screening proxy: value of bench depth relative to starters
  show: 5

news:
  enabled: true
  recent_hours: 24             # ESPN note used without a Sleeper timestamp only if this fresh (and more pessimistic)
  status_play_prob: {Out: 0.0, Doubtful: 0.2, Questionable: 0.6, Day-To-Day: 0.6, GTD: 0.6, Probable: 0.9, Active: 0.97, healthy: 0.97}
  mean_mult_bounds: [0.75, 1.10]
  rules:                       # case-insensitive regex on ESPN short+long comment; first P(play) rule wins
    - {name: ruled_out, unless: '\bnot (been )?ruled out\b|\bhasn''t been ruled out\b', pattern: '\bruled out\b|\bwill not play\b|\bwon''t play\b|\bout for\b', play_prob: 0.0}
    - {name: doubtful, pattern: '\bdoubtful\b', play_prob: 0.2}
    - {name: questionable, pattern: '\bquestionable\b', play_prob: 0.6}
    - {name: probable, pattern: '\bprobable\b', play_prob: 0.9}
    - {name: will_play, pattern: '\bwill play\b|\bcleared\b|\bavailable\b|\bexpected to play\b', play_prob: 0.95}
    - {name: game_time_decision, pattern: '\bgame-time decision\b|\bGTD\b', play_prob: 0.6}
    - {name: minutes_limit, pattern: '\bminutes restriction\b|\bminutes limit\b|\blimited minutes\b', mean_mult: 0.8}
    - {name: rest, pattern: '\brest\b|\bload management\b', play_prob: 0.0, needs_date: true}
    - {name: starting, pattern: '\bstarting lineup\b|\bmove into the starting\b|\bwill start\b', mean_mult: 1.05}

news_llm:
  enabled: true              # needs ANTHROPIC_API_KEY; pregame only, at most once a day
  model: claude-haiku-5-5
  max_dp_play: 0.4           # AI can move P(play) at most this far from the rules value
  minutes_factor_bounds: [0.75, 1.15]
  usd_per_mtok_in: 0.10      # for the local cost log only
  usd_per_mtok_out: 0.50

private_api:
  enabled: true     # read lock state from Sleeper's GraphQL if SLEEPER_TOKEN is set (read-only)

locks:
  file: state/locks.json      # reported locks (email replies, workflow input, or hand edits)
  imap_host: imap.gmail.com
  fuzzy_cutoff: 0.8           # difflib similarity needed for a fuzzy name match
  ineligible:                 # manual: {week: [names]} whose games so far are NOT lockable (benched since tip)
    6: [Kyrie Irving]
  nicknames:                  # extra aliases -> full name (matched against MY roster only)
    AD: Anthony Davis
    Giannis: Giannis Antetokounmpo
    Greek Freak: Giannis Antetokounmpo
    Bam: Bam Adebayo
    PJ: P.J. Washington
    Kai: Kyrie Irving

email:
  # recipient: env EMAIL_TO if set, otherwise the sending account (GMAIL_USER) itself
  user_env: GMAIL_USER
  password_env: GMAIL_APP_PASSWORD
  smtp_host: smtp.gmail.com
  smtp_port: 465
